{% extends 'base.html' %}

{% block title %}Пароль изменен - Yatube{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card text-center">
            <div class="card-body py-5">
                <i class="bi bi-check-circle display-1 text-success"></i>
                <h4 class="mt-3">Пароль успешно изменен!</h4>
                <p class="text-muted">Ваш пароль был успешно изменен.</p>
                <a href="{% url 'users:profile' user.username %}" class="btn btn-primary">
                    Вернуться в профиль
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
