<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'posts:index' %}">
                <i class="bi bi-journal-richtext me-2"></i>Yatube
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Поиск -->
                <form class="d-flex mx-auto" action="{% url 'posts:search' %}" method="get" style="max-width: 400px;">
                    <div class="input-group">
                        <input type="search" class="form-control" name="q" placeholder="Поиск..." 
                               value="{{ request.GET.q|default:'' }}">
                        <button class="btn btn-light" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
                
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'posts:feed' %}">
                                <i class="bi bi-rss"></i> Лента
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'posts:post_create' %}">
                                <i class="bi bi-plus-square"></i> Создать
                            </a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" 
                               role="button" data-bs-toggle="dropdown">
                                {% if user.profile.avatar %}
                                    <img src="{{ user.profile.avatar.url }}" alt="{{ user.username }}" 
                                         class="rounded-circle me-2" width="28" height="28" style="object-fit: cover;">
                                {% else %}
                                    <i class="bi bi-person-circle me-1"></i>
                                {% endif %}
                                {{ user.username }}
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" href="{% url 'users:profile' user.username %}">
                                        <i class="bi bi-person me-2"></i>Профиль
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="{% url 'users:profile_edit' %}">
                                        <i class="bi bi-gear me-2"></i>Настройки
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form method="post" action="{% url 'users:logout' %}">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item text-danger">
                                            <i class="bi bi-box-arrow-right me-2"></i>Выйти
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-light btn-sm ms-2" href="{% url 'users:signup' %}">Регистрация</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
</header>
