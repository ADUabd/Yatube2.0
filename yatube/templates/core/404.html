{% extends 'base.html' %}

{% block title %}Страница не найдена - Yatube{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto text-center py-5">
        <h1 class="display-1 text-muted">404</h1>
        <h2>Страница не найдена</h2>
        <p class="text-muted">
            Запрошенная страница <code>{{ path }}</code> не существует.
        </p>
        <a href="{% url 'posts:index' %}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>На главную
        </a>
    </div>
</div>
{% endblock %}
