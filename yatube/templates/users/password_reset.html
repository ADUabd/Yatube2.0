{% extends 'base.html' %}

{% block title %}Сброс пароля - Yatube{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-envelope me-2"></i>Сброс пароля
                </h4>
            </div>
            <div class="card-body">
                <p class="text-muted">
                    Введите email, указанный при регистрации. Мы отправим вам ссылку для сброса пароля.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" id="id_email" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i>Отправить
                    </button>
                </form>
            </div>
            <div class="card-footer text-center bg-light">
                <a href="{% url 'users:login' %}">Вернуться к входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
