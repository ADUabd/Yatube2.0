{% extends 'base.html' %}

{% block title %}Письмо отправлено - Yatube{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card text-center">
            <div class="card-body py-5">
                <i class="bi bi-envelope-check display-1 text-success"></i>
                <h4 class="mt-3">Письмо отправлено!</h4>
                <p class="text-muted">
                    Мы отправили вам инструкции по сбросу пароля. 
                    Если письмо не пришло, проверьте папку "Спам".
                </p>
                <a href="{% url 'users:login' %}" class="btn btn-primary">
                    Вернуться к входу
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
