{% extends 'base.html' %}

{% block title %}Удалить пост - Yatube{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">
                    <i class="bi bi-exclamation-triangle me-2"></i>Удаление записи
                </h4>
            </div>
            <div class="card-body">
                <p class="mb-3">Вы уверены, что хотите удалить эту запись?</p>
                
                <div class="card bg-light mb-3">
                    <div class="card-body">
                        <p class="mb-0">{{ object.text|truncatechars:200 }}</p>
                    </div>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Да, удалить
                        </button>
                        <a href="{% url 'posts:post_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
